<!DOCTYPE html>
<!--
  READINESS CHECKLIST — Landing page dịch vụ B2B Mytel — BA, Mytel SDLC Kit
  Sinh cuối B3 (SRS+FSD đã xong). Đi kèm (không thay) SRS.md + FSD.md — .md là nguồn sự thật.
  BA chỉ sửa biến DATA. status mỗi ô: 'ok' | 'partial' | 'miss' | 'na'.
-->
<html lang="vi">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Readiness Checklist — Landing B2B Mytel — Đủ điều kiện chốt SRS+FSD</title>
<style>
  :root{--bg:#f4f6f8;--card:#fff;--ink:#1f2733;--muted:#69727f;--line:#e5e9ef;--accent:#f26a21;
    --ok:#1f9d55;--partial:#c98a12;--miss:#c0392b;--na:#aeb6c2;--ok-bg:#e9f7ef;--partial-bg:#fbf1de;--miss-bg:#fbeceb;}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5}
  .wrap{max-width:1180px;margin:0 auto;padding:26px 26px 70px}
  .kick{font:600 12px/1.4 ui-monospace,monospace;letter-spacing:.14em;color:#8a5a12;text-transform:uppercase;margin-bottom:6px}
  h1{margin:0 0 8px;font-size:28px;font-weight:800;letter-spacing:-.4px}
  .lead{color:#40474f;max-width:820px;margin:0 0 6px}
  .meta{color:var(--muted);font-size:13px}
  .banner{margin:16px 0;padding:14px 18px;border-radius:12px;font-weight:700;font-size:15px;border:1px solid var(--line)}
  .banner.go{background:var(--ok-bg);color:#146c3a;border-color:#bfe6cd}
  .banner.warn{background:var(--partial-bg);color:#8a5a12;border-color:#ead9b0}
  .banner.stop{background:var(--miss-bg);color:#8f2a20;border-color:#eec4bf}
  .stats{display:flex;flex-wrap:wrap;gap:14px;margin:6px 0 8px}
  .tile{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px 18px;min-width:130px;flex:1}
  .tile .n{font-size:28px;font-weight:800;line-height:1}
  .tile.ok .n{color:var(--ok)} .tile.miss .n{color:var(--miss)} .tile.partial .n{color:var(--partial)}
  .tile .l{font-size:12.5px;color:var(--muted);margin-top:6px}
  .legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin:6px 0 12px}
  .tools{margin:0 0 12px}
  .tools label{font-size:13px;color:var(--muted);cursor:pointer;user-select:none}
  .tblwrap{overflow-x:auto}
  table{width:100%;border-collapse:separate;border-spacing:0;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
  th,td{padding:10px 12px;text-align:center;border-bottom:1px solid var(--line);font-size:13px}
  th{background:#fbfcfd;font-weight:700;color:#3a4353;font-size:12px;vertical-align:bottom}
  th.grp,td.grp{text-align:left;min-width:210px}
  td.grp .gname{font-weight:700} td.grp .gfr{font:11px/1.4 ui-monospace,monospace;color:var(--muted)}
  td.grp .gnote{color:var(--muted);font-size:12px;margin-top:2px}
  tr:last-child td{border-bottom:0}
  .cell{font-size:16px;font-weight:800}
  .cell.ok{color:var(--ok)} .cell.partial{color:var(--partial)} .cell.miss{color:var(--miss)} .cell.na{color:var(--na)}
  .verd{font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:20px;white-space:nowrap}
  .verd.ok{background:var(--ok-bg);color:var(--ok)} .verd.partial{background:var(--partial-bg);color:var(--partial)} .verd.miss{background:var(--miss-bg);color:var(--miss)}
  .dot{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:6px;vertical-align:middle}
  .dot.ok{background:var(--ok)}.dot.partial{background:var(--partial)}.dot.miss{background:var(--miss)}.dot.na{background:var(--na)}
  footer{max-width:1180px;margin:0 auto;padding:14px 26px 40px;color:var(--muted);font-size:12px}
  @media print{.tools{display:none}body{background:#fff}}
</style>
</head>
<body>
<div class="wrap">
  <div class="kick" id="kick"></div>
  <h1 id="title">Báo cáo đủ điều kiện chốt — SRS + FSD</h1>
  <p class="lead" id="lead"></p>
  <div class="meta" id="meta"></div>
  <div class="banner" id="banner"></div>
  <div class="stats" id="stats"></div>
  <div class="legend">
    <span><span class="dot ok"></span>Đủ (✓)</span>
    <span><span class="dot partial"></span>Một phần (◐)</span>
    <span><span class="dot miss"></span>Thiếu (✗)</span>
    <span><span class="dot na"></span>Không áp dụng (—)</span>
  </div>
  <div class="tools"><label><input type="checkbox" id="onlyGap"> Chỉ hiện nhóm còn thiếu/chưa đủ</label></div>
  <div class="tblwrap"><table id="tbl"></table></div>
</div>
<footer id="foot"></footer>

<script>
/* ===================== BA CHỈ SỬA PHẦN DATA NÀY ===================== */
const DATA = {
  project:"Landing page dịch vụ B2B Mytel (18 dịch vụ + Admin CMS-lite)",
  milestone:"Chốt SRS + FSD (cuối B3) — trình GATE-3",
  updated:"2026-09-02",
  criteria:[   // 8 tiêu chí kiểm cho mỗi nhóm nghiệp vụ
    {id:"srs",     name:"SRS chi tiết",       tip:"Luồng chính/thay thế, validate field-level, quy tắc & bảng quyết định"},
    {id:"ac",      name:"Tiêu chí AC",        tip:"Tiêu chí chấp nhận Given–When–Then cho FR quan trọng"},
    {id:"trace",   name:"Truy vết BRD",       tip:"Mọi FR nối về mục tiêu BG trong BRD (SRS §7)"},
    {id:"fsd",     name:"FSD màn hình",       tip:"FSD đặc tả màn hình (SCR): element, luồng, 4 trạng thái UI, errorCode→message"},
    {id:"usecase", name:"Phủ use case",       tip:"Mọi UC/F của actor có màn hình (FSD §2b) — không use case mồ côi"},
    {id:"state",   name:"Phủ trạng thái",     tip:"Mọi ô ✓ ma trận trạng thái×hành động có màn (FSD §4b); ô ✗ ẩn/disable"},
    {id:"matrix",  name:"Ma trận FR↔SCR↔API", tip:"Ma trận FR↔UC↔SCR↔API↔trạng thái phủ 100% FR (FSD §4)"},
    {id:"nfr",     name:"NFR",                tip:"NFR liên quan đã xác định & đo được (SRS §4)"}
  ],
  groups:[
    { id:"G1", name:"Public site (Landing, khối động, đổi ngôn ngữ)", fr:"FR-01,02,03 · SCR-01,05",
      checks:{srs:"ok", ac:"ok", trace:"ok", fsd:"ok", usecase:"ok", state:"ok", matrix:"ok", nfr:"ok"},
      note:"Empty-state landing khi khối động ẩn hết (FR-01) đã đặc tả; ẩn khối thiếu bản dịch (BR-DYN-01). Bố cục pixel [chờ design.md]." },

    { id:"G2", name:"Service catalog (3 nhóm, chi tiết 18 dịch vụ, CTA)", fr:"FR-04,05,06 · SCR-02,03",
      checks:{srs:"ok", ac:"ok", trace:"ok", fsd:"ok", usecase:"ok", state:"ok", matrix:"ok", nfr:"ok"},
      note:"Map 8 trường Excel→hiển thị 7 (ẩn Price Policy); 404 slug sai; E-04 chỉ trạng thái Hiển thị. Bố cục [chờ design.md]." },

    { id:"G3", name:"Lead (form, lưu DB, email báo Sale, chống spam, Admin xem)", fr:"FR-07,08,09,10,11 · SCR-04,09",
      checks:{srs:"ok", ac:"ok", trace:"ok", fsd:"ok", usecase:"ok", state:"ok", matrix:"ok", nfr:"ok"},
      note:"Form: 6 trường + consent + honeypot; errorCode LEAD-001/010/021/030 (honeypot 200 giả) khớp api-spec §3.1; E-01 Mới→Đã xem; empty-state lead rỗng/lọc rỗng. Phụ thuộc môi trường (không phải hở spec): email Sale + SMTP relay [cần anh Bryan — AS-09]." },

    { id:"G4", name:"Admin content (CRUD 3 loại khối, bật/ẩn, sắp thứ tự)", fr:"FR-12,13,14,15 · SCR-07,08",
      checks:{srs:"ok", ac:"ok", trace:"ok", fsd:"ok", usecase:"ok", state:"ok", matrix:"ok", nfr:"ok"},
      note:"3 loại (Highlight/Đối tác/Con số) đa ngữ, đăng thẳng; chặn bật khi thiếu trường EN (CB-010); E-02 đủ 4 trạng thái Nháp/Hiển thị/Ẩn/Đã xóa. Endpoint block CRUD khớp api-spec §3.5–3.11 (CB-001/010/404)." },

    { id:"G5", name:"Admin auth (đăng nhập/đăng xuất, khóa brute-force, audit log)", fr:"FR-16,17,18 · SCR-06, SHELL-ADMIN",
      checks:{srs:"ok", ac:"ok", trace:"ok", fsd:"ok", usecase:"ok", state:"partial", matrix:"ok", nfr:"ok"},
      note:"Core đủ: đăng nhập/khóa 5-15 (AUTH-001/010), đăng xuất/hết phiên 30ph (AUTH-020/401), audit log mọi thao tác; khớp api-spec §3.3/3.4. ◐ Trạng thái: ô ✓ 'Đổi mật khẩu' (ma trận E-03, trạng thái Hoạt động) KHÔNG có màn/FR/endpoint ở MVP — ngoài 18 FR của SRS, xử lý qua vận hành/seed; chờ anh Bryan quyết có đưa vào phạm vi." }
  ]
};
/* =================== HẾT PHẦN BA CẦN SỬA =================== */

const ICON={ok:"✓",partial:"◐",miss:"✗",na:"—"};
const verdictOf=g=>{const v=DATA.criteria.map(c=>g.checks[c.id]||'na');
  if(v.includes('miss'))return'miss'; if(v.includes('partial'))return'partial'; return'ok';};
const VLABEL={ok:"Đủ",partial:"Đang hoàn thiện",miss:"Thiếu"};

let nOk=0,nPartial=0,nMiss=0;
DATA.groups.forEach(g=>{const v=verdictOf(g); if(v==='ok')nOk++; else if(v==='partial')nPartial++; else nMiss++;});

document.getElementById('kick').textContent=[DATA.project,"ĐỦ ĐIỀU KIỆN CHỐT",DATA.milestone,"CẬP NHẬT "+DATA.updated].join("  ·  ");
document.getElementById('lead').innerHTML="Checklist theo <b>từng nhóm nghiệp vụ (G1–G5)</b>: mỗi nhóm đã <b>đủ</b> đặc tả để chuyển thiết kế/thi công chưa. Đi kèm (không thay) <code>SRS.md</code> + <code>FSD.md</code> — .md là nguồn sự thật.";
document.getElementById('meta').textContent=`${DATA.groups.length} nhóm · ${DATA.criteria.length} tiêu chí · Cập nhật ${DATA.updated}`;
document.getElementById('foot').textContent="Sinh bởi BA (Mytel SDLC Kit) cuối B3, đi kèm SRS.md + FSD.md. Nhóm 'Thiếu' phải bổ sung trước khi trình GATE-3. BA không tự phê duyệt cổng.";

// banner
const bn=document.getElementById('banner');
if(nMiss){bn.className="banner stop";bn.textContent=`⛔ CHƯA sẵn sàng chốt — còn THIẾU ở ${nMiss} nhóm (bổ sung trước khi trình GATE-3).`;}
else if(nPartial){bn.className="banner warn";bn.textContent=`⚠️ Gần đủ — ${nPartial} nhóm đang hoàn thiện (điểm ◐ là hạng mục ngoài 18 FR / phụ thuộc chờ cấp); rà nốt trước khi chốt. 18/18 FR đã phủ trong ma trận FSD.`;}
else{bn.className="banner go";bn.textContent="✅ SẴN SÀNG chốt SRS + FSD — mọi nhóm đã đủ điều kiện.";}

// stats
document.getElementById('stats').innerHTML=
  `<div class="tile"><div class="n">${DATA.groups.length}</div><div class="l">Nhóm nghiệp vụ (G1–G5)</div></div>
   <div class="tile ok"><div class="n">${nOk}</div><div class="l">Đủ</div></div>
   <div class="tile partial"><div class="n">${nPartial}</div><div class="l">Đang hoàn thiện</div></div>
   <div class="tile miss"><div class="n">${nMiss}</div><div class="l">Thiếu</div></div>`;

// table
const tbl=document.getElementById('tbl');
let head=`<thead><tr><th class="grp">Nhóm nghiệp vụ</th>${DATA.criteria.map(c=>`<th title="${c.tip}">${c.name}</th>`).join('')}<th>Kết luận</th></tr></thead>`;
let body="<tbody>";
DATA.groups.forEach(g=>{
  const v=verdictOf(g);
  body+=`<tr data-verdict="${v}"><td class="grp"><div class="gname">${g.name}</div><div class="gfr">${g.id} · ${g.fr||''}</div>${g.note?`<div class="gnote">${g.note}</div>`:''}</td>`+
    DATA.criteria.map(c=>{const s=g.checks[c.id]||'na';return `<td><span class="cell ${s}" title="${c.name}: ${VLABEL[s]||'Không áp dụng'}">${ICON[s]}</span></td>`;}).join('')+
    `<td><span class="verd ${v}">${VLABEL[v]}</span></td></tr>`;
});
body+="</tbody>";
tbl.innerHTML=head+body;

// filter
document.getElementById('onlyGap').addEventListener('change',e=>{
  const on=e.target.checked;
  tbl.querySelectorAll('tbody tr').forEach(tr=>{
    tr.style.display=(on && tr.dataset.verdict==='ok')?'none':'';
  });
});
</script>
</body>
</html>
